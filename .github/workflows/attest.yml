name: Release attestation

on:
  workflow_dispatch:
  push:
    branches: [main, feat/attestation]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  attest:
    name: Build and attest candidate artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check current release inputs
        env:
          EVIDENCE_BASE_SHA: ${{ github.event.before }}
        run: |
          node scripts/v2/check-docs-consistency.mjs
          node scripts/v2/validate-evidence.mjs --allow-evidence-only --allow-readiness --require-clean
          node scripts/v2/release-gates.mjs --allow-evidence-only --allow-readiness
          node scripts/v2/check-release.mjs --check-only
          node scripts/v2/v2-readiness.mjs --require-ready --no-waivers
          node scripts/v2/check-blocker-map.mjs
          node scripts/v2/release-smoke.mjs

      - name: Build deterministic candidate
        run: node scripts/v2/build-release.mjs --out dist --evidence docs/v2/acceptance/release-build.json

      - name: Attest artifact provenance
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/armorbreak-portable-*.tar.gz

      - name: Verify attestation and write evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_REF: ${{ github.ref }}
          SOURCE_COMMIT: ${{ github.sha }}
          SOURCE_REPOSITORY: ${{ github.repository }}
          ATTESTATION_ID: ${{ steps.attest.outputs.attestation-id }}
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
        run: |
          mkdir -p docs/v2/acceptance
          gh attestation verify dist/armorbreak-portable-*.tar.gz \
            --repo "$SOURCE_REPOSITORY" \
            --signer-workflow "$SOURCE_REPOSITORY/.github/workflows/attest.yml" \
            --cert-identity "https://github.com/$SOURCE_REPOSITORY/.github/workflows/attest.yml@$SOURCE_REF" \
            --source-ref "$SOURCE_REF" \
            --source-digest "$SOURCE_COMMIT" \
            --format json > docs/v2/acceptance/github-attestation.json
          node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('docs/v2/acceptance/github-attestation.json'));console.log(JSON.stringify({attestationId:process.env.ATTESTATION_ID,bundlePath:process.env.BUNDLE_PATH,verified:true,sourceRepository:process.env.SOURCE_REPOSITORY,sourceRef:process.env.SOURCE_REF,sourceCommit:process.env.SOURCE_COMMIT,count:Array.isArray(a)?a.length:1},null,2))"

      - name: Generate current readiness with verified artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ARTIFACT="$(find dist -maxdepth 1 -type f -name 'armorbreak-portable-*.tar.gz' -print -quit)"
          test -n "$ARTIFACT"
          ARMORBREAK_PORTABLE_ARTIFACT="$ARTIFACT" node scripts/v2/v2-readiness.mjs --write

      - name: Upload attestation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-attestation
          path: |
            docs/v2/acceptance/github-attestation.json
            dist/armorbreak-portable-*.tar.gz
            dist/armorbreak-portable-*.tar.gz.sbom.cdx.json
          if-no-files-found: error
