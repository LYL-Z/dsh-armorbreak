name: CI

on:
  push:
    branches: [main, feature/abu-universal, feature/v2.2-ga, feature/v2.3-universal-program-intelligence]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Prepare runner-local temporary directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtimeTemp = Join-Path $env:RUNNER_TEMP 'armorbreak-ci-tmp'
          New-Item -ItemType Directory -Force -Path $runtimeTemp | Out-Null
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "TEMP=$runtimeTemp`nTMP=$runtimeTemp`n")

      - name: Prepare runner-local temporary directory (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          runtime_temp="$RUNNER_TEMP/armorbreak-ci-tmp"
          mkdir -p "$runtime_temp"
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$runtime_temp" "$runtime_temp" "$runtime_temp" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}

      # The M5 behavior regression suite executes a self-authored Python
      # reference fixture; pin its runtime instead of relying on runner image PATH.
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v5
        with:
          python-version: '3.11'

      - name: Environment facts
        run: node --version && node -e "console.log(process.platform, process.arch)"

      - name: Install locked dev dependencies
        run: npm ci --no-audit --no-fund

      # Runtime remains dependency-free; TypeScript is a locked dev dependency
      # used only to compile the SDK contract and consumer fixture.
      - name: Full test suite
        run: node --test --test-concurrency=1

      - name: Coverage
        if: matrix.os == 'ubuntu-latest'
        run: node --test --test-concurrency=1 --experimental-test-coverage

      - name: Reproducible micro-benchmarks
        if: matrix.os == 'ubuntu-latest'
        run: node benchmarks/bench.mjs --out benchmarks/results.ci.json

      - name: Text files are valid UTF-8
        run: node --test tests/hardening.test.mjs

  offline-core:
    name: L0 offline boundary (static gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v5
        with:
          python-version: '3.11'
      - name: Static L0 network-free gate
        run: node --test tests/offline-core.test.mjs
      - name: Core benchmark (runnable subset)
        env:
          ARMORBREAK_OFFLINE: '1'
        run: node scripts/v2/core-benchmark.mjs

  live-docker:
    name: L1 Docker integration (real daemon)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v5
        with:
          python-version: '3.11'

      - name: Wait for Docker daemon
        run: |
          for attempt in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "Docker daemon ready after ${attempt} attempt(s)"
              exit 0
            fi
            echo "Docker daemon not ready (attempt ${attempt}/30); retrying in 2s"
            sleep 2
          done
          echo "Docker daemon did not become ready within 60s"
          docker info || true
          exit 1

      - name: Pull a digest-pinned image
        run: |
          docker pull busybox:1.36
          IMAGE="busybox@$(docker inspect --format='{{index .RepoDigests 0}}' busybox:1.36 | cut -d@ -f2)"
          echo "ARMORBREAK_L1_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "using $IMAGE"

      - name: Verify hardened container execution path
        run: node scripts/verify-l1.mjs --image "$ARMORBREAK_L1_IMAGE"

      - name: Upload L1 verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: l1-docker-verification
          path: docs/acceptance/l1-docker-verification.json
          if-no-files-found: warn

  release-evidence:
    name: Release evidence checks (commit-bound)
    # V2.3 has a separate exact-head acceptance manifest. Preserve the V2.2
    # release gates for every other branch/tag; do not reinterpret V2.3 source
    # changes as an evidence-only append to the inherited V2.2 baseline.
    if: ${{ !((github.event_name == 'pull_request' && startsWith(github.head_ref, 'feature/v2.3-')) || (github.event_name != 'pull_request' && startsWith(github.ref_name, 'feature/v2.3-'))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      attestations: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24

      - name: Docs consistency
        if: github.ref != 'refs/tags/v2.2.0'
        run: node scripts/v2/check-docs-consistency.mjs

      - name: Evidence hashes and references
        if: github.ref != 'refs/tags/v2.2.0'
        env:
          EVIDENCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/v2/validate-evidence.mjs --allow-docs-only --allow-evidence-only --allow-readiness --require-clean

      - name: Evidence-driven release gates
        if: github.ref != 'refs/tags/v2.2.0'
        env:
          EVIDENCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/v2/release-gates.mjs --allow-docs-only --allow-evidence-only --allow-readiness

      - name: Check release evidence readiness
        if: github.ref != 'refs/tags/v2.2.0'
        run: node scripts/v2/check-release.mjs --check-only

      - name: Live pre-release readiness
        if: github.ref != 'refs/tags/v2.2.0'
        run: node scripts/v2/v2-readiness.mjs --require-ready --no-waivers

      - name: Release evidence smoke
        if: github.ref != 'refs/tags/v2.2.0'
        run: node scripts/v2/release-smoke.mjs

      - name: GA blocker root-cause map
        if: github.ref != 'refs/tags/v2.2.0'
        run: node scripts/v2/check-blocker-map.mjs

      - name: Verify owner-published Stable tag and exact-main provenance
        if: github.ref == 'refs/tags/v2.2.0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/v2/verify-published-stable.mjs


