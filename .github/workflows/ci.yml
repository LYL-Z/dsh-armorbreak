name: CI

on:
  push:
    branches: [main, feature/abu-universal, feature/v2.2-ga]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Environment facts
        run: node --version && node -e "console.log(process.platform, process.arch)"

      - name: Install locked dev dependencies
        run: npm ci --no-audit --no-fund

      # Runtime remains dependency-free; TypeScript is a locked dev dependency
      # used only to compile the SDK contract and consumer fixture.
      - name: Full test suite
        run: node --test --test-concurrency=1

      - name: Coverage
        if: matrix.os == 'ubuntu-latest'
        run: node --test --test-concurrency=1 --experimental-test-coverage

      - name: Reproducible micro-benchmarks
        if: matrix.os == 'ubuntu-latest'
        run: node benchmarks/bench.mjs --out benchmarks/results.ci.json

      - name: Text files are valid UTF-8
        run: node --test tests/hardening.test.mjs

  offline-core:
    name: L0 offline boundary (static gate)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static L0 network-free gate
        run: node --test tests/offline-core.test.mjs
      - name: Core benchmark (runnable subset)
        env:
          ARMORBREAK_OFFLINE: '1'
        run: node scripts/v2/core-benchmark.mjs

  live-docker:
    name: L1 Docker integration (real daemon)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Wait for Docker daemon
        run: |
          for attempt in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then
              echo "Docker daemon ready after ${attempt} attempt(s)"
              exit 0
            fi
            echo "Docker daemon not ready (attempt ${attempt}/30); retrying in 2s"
            sleep 2
          done
          echo "Docker daemon did not become ready within 60s"
          docker info || true
          exit 1

      - name: Pull a digest-pinned image
        run: |
          docker pull busybox:1.36
          IMAGE="busybox@$(docker inspect --format='{{index .RepoDigests 0}}' busybox:1.36 | cut -d@ -f2)"
          echo "ARMORBREAK_L1_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "using $IMAGE"

      - name: Verify hardened container execution path
        run: node scripts/verify-l1.mjs --image "$ARMORBREAK_L1_IMAGE"

      - name: Upload L1 verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l1-docker-verification
          path: docs/acceptance/l1-docker-verification.json
          if-no-files-found: warn

  release-evidence:
    name: Release evidence checks (commit-bound)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Docs consistency
        run: node scripts/v2/check-docs-consistency.mjs

      - name: Evidence hashes and references
        env:
          EVIDENCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/v2/validate-evidence.mjs --allow-docs-only --allow-evidence-only --allow-readiness --require-clean

      - name: Evidence-driven release gates
        env:
          EVIDENCE_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/v2/release-gates.mjs --allow-docs-only --allow-evidence-only --allow-readiness

      - name: GA blocker root-cause map
        run: node scripts/v2/check-blocker-map.mjs


