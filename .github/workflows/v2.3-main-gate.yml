name: V2.3 main and release gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v2.3.1']

permissions:
  contents: read

concurrency:
  group: v23-gate-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  v24-development-validation:
    # Run a real candidate matrix for post-release development PRs and later
    # main commits. The frozen V2.3.1 tag/main contracts below remain separate.
    if: ${{ (github.event_name == 'pull_request' && !(startsWith(github.head_ref, 'feature/v2.3') || startsWith(github.head_ref, 'fix/v2.3'))) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha != 'cfb984b7178bb8b1dca9728325fdbe599b5430a3') }}
    name: Node ${{ matrix.node }} / ${{ matrix.os }} (V2.4 candidate)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Assert exact candidate SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v5
        with:
          python-version: '3.11'
      - name: Prepare repository-local test scratch root
        run: >-
          node -e "require('node:fs').mkdirSync('.runtime/tmp', { recursive: true })"
      - run: npm ci --no-audit --no-fund
      - name: Full test suite
        run: node --test --test-concurrency=1
      - name: TypeScript contract check
        run: npm run typecheck

  v24-development-l0:
    if: ${{ (github.event_name == 'pull_request' && !(startsWith(github.head_ref, 'feature/v2.3') || startsWith(github.head_ref, 'fix/v2.3'))) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha != 'cfb984b7178bb8b1dca9728325fdbe599b5430a3') }}
    name: V2.4 L0 offline boundary
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v5
        with:
          python-version: '3.11'
      - name: Assert exact candidate SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Static L0 network-free gate
        run: node --test tests/offline-core.test.mjs
      - name: Core benchmark (runnable subset)
        env:
          ARMORBREAK_OFFLINE: '1'
        run: node scripts/v2/core-benchmark.mjs

  v24-development-l1:
    if: ${{ (github.event_name == 'pull_request' && !(startsWith(github.head_ref, 'feature/v2.3') || startsWith(github.head_ref, 'fix/v2.3'))) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha != 'cfb984b7178bb8b1dca9728325fdbe599b5430a3') }}
    name: V2.4 L1 real Docker integration
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Assert exact candidate SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Wait for Docker daemon
        run: |
          for attempt in $(seq 1 30); do
            if docker info >/dev/null 2>&1; then exit 0; fi
            echo "Docker daemon not ready (attempt ${attempt}/30)"
            sleep 2
          done
          docker info
          exit 1
      - name: Pull a digest-pinned image
        run: |
          docker pull busybox:1.36
          IMAGE="busybox@$(docker inspect --format='{{index .RepoDigests 0}}' busybox:1.36 | cut -d@ -f2)"
          echo "ARMORBREAK_L1_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          echo "using $IMAGE"
      - name: Verify hardened container execution path
        run: node scripts/verify-l1.mjs --image "$ARMORBREAK_L1_IMAGE"

  v24-development-gate:
    # always() makes this stable summary execute after failures/skips; it fails
    # closed unless every expected V2.4 validation job actually succeeded.
    if: ${{ always() && ((github.event_name == 'pull_request' && !(startsWith(github.head_ref, 'feature/v2.3') || startsWith(github.head_ref, 'fix/v2.3'))) || (github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha != 'cfb984b7178bb8b1dca9728325fdbe599b5430a3')) }}
    name: V2.4 development gate (all required validations)
    needs: [v24-development-validation, v24-development-l0, v24-development-l1]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require every validation job to have executed successfully
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.v24-development-validation.result }}
          L0_RESULT: ${{ needs.v24-development-l0.result }}
          L1_RESULT: ${{ needs.v24-development-l1.result }}
        run: |
          printf 'matrix=%s\nl0=%s\nl1=%s\n' "$MATRIX_RESULT" "$L0_RESULT" "$L1_RESULT"
          test "$MATRIX_RESULT" = success
          test "$L0_RESULT" = success
          test "$L1_RESULT" = success

  pr-candidate-validation:
    # V2.3's evidence-only contract is frozen. Do not apply it to later
    # feature branches (which correctly fail its post-source allowlist).
    if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feature/v2.3') || startsWith(github.head_ref, 'fix/v2.3')) }}
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Prepare runner-local temporary directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtimeTemp = Join-Path $env:RUNNER_TEMP 'armorbreak-v23-ci-tmp'
          New-Item -ItemType Directory -Force -Path $runtimeTemp | Out-Null
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "TEMP=$runtimeTemp`nTMP=$runtimeTemp`n")
      - name: Prepare runner-local temporary directory (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          runtime_temp="$RUNNER_TEMP/armorbreak-v23-ci-tmp"
          mkdir -p "$runtime_temp"
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$runtime_temp" "$runtime_temp" "$runtime_temp" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v5
        with:
          python-version: '3.11'
      - name: Assert exact PR candidate SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Prepare repository-local test scratch root
        run: >-
          node -e "require('node:fs').mkdirSync('.runtime/tmp', { recursive: true })"
      - run: npm ci --no-audit --no-fund
      - run: node --test --test-concurrency=1
      - run: npm run typecheck
      - name: Lint V2.3 workflow with pinned actionlint
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '24' }}
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 /repo/.github/workflows/v2.3-main-gate.yml
      - name: Validate V2.3 evidence and PR release contract
        env:
          V23_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          V23_EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          node scripts/v2/validate-v23-acceptance.mjs
          node scripts/v2/check-docs-consistency.mjs
          node scripts/v2/v23-release-gate.mjs --check-pr

  main-candidate-validation:
    # Exact published V2.3.1 source only; future main commits are development.
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha == 'cfb984b7178bb8b1dca9728325fdbe599b5430a3' }}
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Prepare runner-local temporary directory (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtimeTemp = Join-Path $env:RUNNER_TEMP 'armorbreak-v23-ci-tmp'
          New-Item -ItemType Directory -Force -Path $runtimeTemp | Out-Null
          [System.IO.File]::AppendAllText($env:GITHUB_ENV, "TEMP=$runtimeTemp`nTMP=$runtimeTemp`n")
      - name: Prepare runner-local temporary directory (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          runtime_temp="$RUNNER_TEMP/armorbreak-v23-ci-tmp"
          mkdir -p "$runtime_temp"
          printf 'TMPDIR=%s\nTEMP=%s\nTMP=%s\n' "$runtime_temp" "$runtime_temp" "$runtime_temp" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: actions/setup-python@7f4fc3e22c37d6ff65e88745f38bd3157c663f7c # v5
        with:
          python-version: '3.11'
      - name: Assert exact main SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Prepare repository-local test scratch root
        run: >-
          node -e "require('node:fs').mkdirSync('.runtime/tmp', { recursive: true })"
      - run: npm ci --no-audit --no-fund
      - run: node --test --test-concurrency=1
      - run: npm run typecheck
      - name: Lint V2.3 workflow with pinned actionlint
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.node == '24' }}
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo:ro" rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 /repo/.github/workflows/v2.3-main-gate.yml
      - name: Validate V2.3 evidence and main release contract
        env:
          V23_EXPECTED_HEAD: ${{ github.sha }}
          V23_EXPECTED_SHA: ${{ github.sha }}
        run: |
          node scripts/v2/validate-v23-acceptance.mjs
          node scripts/v2/check-docs-consistency.mjs
          node scripts/v2/v23-release-gate.mjs --check-main

  build-and-attest-main-candidate:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha == 'cfb984b7178bb8b1dca9728325fdbe599b5430a3' }}
    name: V2.3 main candidate build and provenance
    needs: main-candidate-validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Assert exact attested source SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - run: npm ci --no-audit --no-fund
      - name: Build reproducible candidate package and SBOM
        run: node scripts/v2/build-release.mjs --out dist --evidence dist/release-build.json --no-portable-evidence
      - name: Exercise exact archive in a clean environment with production dependencies
        env:
          V23_PORTABLE_ARTIFACT: dist/armorbreak-portable-2.3.1.tar.gz
          V23_PORTABLE_EVIDENCE: dist/v23-portable-cleanroom.json
        run: node scripts/v2/v23-portable-cleanroom.mjs
      - name: Attest exact candidate package
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: dist/armorbreak-portable-*.tar.gz
      - name: Verify attestation against exact main source
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          gh attestation verify dist/armorbreak-portable-*.tar.gz \
            --repo LYL-Z/dsh-armorbreak \
            --signer-workflow LYL-Z/dsh-armorbreak/.github/workflows/v2.3-main-gate.yml \
            --source-ref refs/heads/main --source-digest "$EXPECTED_SHA" --format json > dist/attestation-verification.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v23-main-candidate-${{ github.sha }}
          path: |
            dist/armorbreak-portable-*.tar.gz
            dist/armorbreak-portable-*.tar.gz.sbom.cdx.json
            dist/armorbreak-portable-*.tar.gz.manifest.json
            dist/release-build.json
            dist/v23-portable-cleanroom.json
            dist/attestation-verification.json
          if-no-files-found: error
          retention-days: 90

  pr-windows-package-drill:
    if: ${{ github.event_name == 'pull_request' && (startsWith(github.head_ref, 'feature/v2.3') || startsWith(github.head_ref, 'fix/v2.3')) }}
    name: V2.2 to PR package Windows deployment and rollback
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - run: npm ci --no-audit --no-fund
      - name: Build and exercise the exact PR package
        env:
          V23_PORTABLE_ARTIFACT: dist/armorbreak-portable-2.3.1.tar.gz
          V23_PORTABLE_EVIDENCE: dist/v23-portable-cleanroom.json
        run: |
          node scripts/v2/build-release.mjs --out dist --evidence dist/release-build.json --no-portable-evidence
          node scripts/v2/v23-portable-cleanroom.mjs
      - name: Run real V2.2 to exact PR package deployment and rollback drill
        env:
          GH_TOKEN: ${{ github.token }}
          V23_DIAGNOSTICS_PATH: ${{ runner.temp }}/v23-windows-drill-diagnostics.json
        run: node scripts/v2/v23-real-package-drill.mjs
      - name: Upload PR Windows diagnostics (including failure evidence)
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v23-pr-windows-diagnostics-${{ github.event.pull_request.head.sha }}
          path: |
            dist/v23-portable-cleanroom.json
            ${{ runner.temp }}/v23-windows-drill-diagnostics.json
          if-no-files-found: warn
          retention-days: 90
      - name: Upload successful PR Windows drill evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v23-pr-windows-drill-evidence-${{ github.event.pull_request.head.sha }}
          path: docs/v2.3/evidence/p0-h/real-package-upgrade-rollback.json
          if-no-files-found: error
          retention-days: 90

  main-windows-package-drill:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.sha == 'cfb984b7178bb8b1dca9728325fdbe599b5430a3' }}
    name: Exact main package Windows deployment and rollback
    needs: [main-candidate-validation, build-and-attest-main-candidate]
    runs-on: windows-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.4
      - name: Download exact main candidate package and SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: v23-main-candidate-${{ github.sha }}
          path: dist
      - name: Assert candidate package metadata binds exact main SHA
        shell: pwsh
        run: |
          $manifest = Get-Content dist/armorbreak-portable-2.3.1.tar.gz.manifest.json -Raw | ConvertFrom-Json
          if ($manifest.commit -ne $env:GITHUB_SHA -or $manifest.reproducible -ne $true -or $manifest.cleanRoom.result -ne 'PASS') { throw 'Main candidate package manifest does not bind the exact reproducible source SHA' }
      - name: Run real V2.2 to exact main V2.3 package deployment and rollback drill
        env:
          GH_TOKEN: ${{ github.token }}
          V23_DIAGNOSTICS_PATH: ${{ runner.temp }}/v23-windows-drill-diagnostics.json
        run: node scripts/v2/v23-real-package-drill.mjs
      - name: Stage exact release drill evidence
        shell: pwsh
        run: Copy-Item docs/v2.3/evidence/p0-h/real-package-upgrade-rollback.json docs/v2.3/evidence/p0-h/latest-release-rollback.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v23-main-rollback-${{ github.sha }}
          path: docs/v2.3/evidence/p0-h/latest-release-rollback.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload exact-main Windows drill diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v23-main-windows-diagnostics-${{ github.sha }}
          path: ${{ runner.temp }}/v23-windows-drill-diagnostics.json
          if-no-files-found: warn
          retention-days: 90

  release-verification:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/tags/v2.3.1' }}
    name: V2.3.1 release verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Verify owner tag event and locate exact successful main candidate
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        shell: bash
        run: |
          test "$GITHUB_REF" = 'refs/tags/v2.3.1'
          sender_id="$(node -e "const e=require(process.env.GITHUB_EVENT_PATH); process.stdout.write(String(e.sender?.id ?? ''))")"
          test "$sender_id" = '250811935'
          echo "V23_EVENT_SENDER_ID=$sender_id" >> "$GITHUB_ENV"
          run_json="$(gh run list --repo LYL-Z/dsh-armorbreak --workflow v2.3-main-gate.yml --branch main --event push --status success --limit 100 --json databaseId,headSha)"
          run_id="$(printf '%s' "$run_json" | node -e 'const fs=require("node:fs"); const runs=JSON.parse(fs.readFileSync(0,"utf8")); const matches=runs.filter((run)=>run.headSha===process.env.EXPECTED_SHA); if (!matches.length) process.exit(1); process.stdout.write(String(matches[0].databaseId))')"
          echo "V23_MAIN_RUN_ID=$run_id" >> "$GITHUB_ENV"
      - name: Download exact main candidate and Windows rollback evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh run download "$V23_MAIN_RUN_ID" --repo LYL-Z/dsh-armorbreak --name "v23-main-candidate-${GITHUB_SHA}" --dir dist
          gh run download "$V23_MAIN_RUN_ID" --repo LYL-Z/dsh-armorbreak --name "v23-main-rollback-${GITHUB_SHA}" --dir rollback-evidence
          cp rollback-evidence/latest-release-rollback.json dist/latest-release-rollback.json
      - name: Create detached release authorization payload
        env:
          V23_AUTH_ENVELOPE_PATH: ${{ runner.temp }}/v23-release-authorization.json
          RUNNER_TEMP: ${{ runner.temp }}
        run: node scripts/v2/create-v23-release-envelope.mjs
      - name: Attest detached authorization payload with GitHub OIDC provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: ${{ runner.temp }}/v23-release-authorization.json
      - name: Verify tag, owner authorization, exact main provenance and release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          V23_AUTH_ENVELOPE_PATH: ${{ runner.temp }}/v23-release-authorization.json
        run: |
          gh attestation verify "$V23_AUTH_ENVELOPE_PATH" --repo LYL-Z/dsh-armorbreak \
            --signer-workflow LYL-Z/dsh-armorbreak/.github/workflows/v2.3-main-gate.yml \
            --source-ref refs/tags/v2.3.1 --source-digest "$GITHUB_SHA" --format json > dist/release-envelope-attestation.json
          node scripts/v2/validate-v23-acceptance.mjs
          node scripts/v2/v23-release-gate.mjs --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v23-release-proof-${{ github.sha }}
          path: |
            dist/armorbreak-portable-2.3.1.tar.gz
            dist/armorbreak-portable-2.3.1.tar.gz.sbom.cdx.json
            dist/armorbreak-portable-2.3.1.tar.gz.manifest.json
            dist/attestation-verification.json
            dist/release-envelope-attestation.json
            ${{ runner.temp }}/v23-release-authorization.json
