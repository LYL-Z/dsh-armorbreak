name: V2.4 npm distribution validation
on:
  pull_request:
    branches: ['**']
    paths:
      - package.json
      - package-lock.json
      - npm-shrinkwrap.json
      - packages/**
      - lib/**
      - workbench/**
      - scripts/v24/**
      - tests/npm-distribution-r3.test.mjs
      - .github/workflows/v24-package-validation.yml
permissions:
  contents: read
jobs:
  install:
    if: startsWith(github.head_ref, 'fix/v24-r3-') || startsWith(github.head_ref, 'feat/v24-r3-') || startsWith(github.head_ref, 'test/v24-r3-')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked build and test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Actual frozen TGZ installation and runtime validation
        run: node scripts/v24/verify-npm-distribution.mjs --commit ${{ github.event.pull_request.head.sha }} --out ${{ runner.temp }}/armorbreak-distribution-${{ matrix.node }}
