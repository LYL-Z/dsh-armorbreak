name: V2.4 npm distribution validation
on:
  pull_request:
    branches: ['**']
    paths:
      - package.json
      - package-lock.json
      - npm-shrinkwrap.json
      - packages/**
      - lib/**
      - workbench/**
      - scripts/v24/**
      - tests/npm-distribution-r3.test.mjs
      - .github/workflows/v24-package-validation.yml
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  install:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node }}
      - name: Install locked build and test dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Actual frozen TGZ installation and runtime validation
        run: node scripts/v24/verify-npm-distribution.mjs --commit ${{ github.event.pull_request.head.sha || github.sha }} --out ${{ runner.temp }}/armorbreak-distribution-${{ matrix.node }}
      - name: Preview source manifest, dependency SBOM and license texts
        id: preview
        shell: bash
        run: |
          if node -e "process.exit(/^2\\.4\\.0-preview\\.[1-9]\\d*$/.test(require('./package.json').version)?0:1)"; then
            node scripts/v24/preview-metadata.mjs --validation "${{ runner.temp }}/armorbreak-distribution-${{ matrix.node }}" --out "${{ runner.temp }}/armorbreak-preview-${{ matrix.node }}"
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Upload bounded development Preview files
        if: steps.preview.outputs.ready == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v24-development-preview-${{ matrix.os }}-node${{ matrix.node }}-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/armorbreak-preview-${{ matrix.node }}/*
          if-no-files-found: error
          retention-days: 7
